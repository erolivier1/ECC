name: Sync upstream
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD:.github/workflows/sync-upstream.yml > /tmp/sync-upstream.yml
          git remote add upstream https://github.com/affaan-m/ECC.git
          git fetch upstream --tags
          git reset --hard upstream/main
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml
          git diff --cached --quiet || git commit -m "Keep sync workflow on top of upstream"
          git push origin main --force
          git push origin --tags --force
